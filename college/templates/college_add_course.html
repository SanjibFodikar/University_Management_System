{% extends 'college_nav.html' %}

{% load static %}

{% block content %}

<div class="container py-5" style="margin-top: 80px;">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow border-0 rounded-4">

                <!-- Header -->
                <div class="card-header text-white text-center py-3"
                    style="background: linear-gradient(180deg, #073b3a, #0b5250);">

                    <h3 class="mb-0">
                        <i class="bi bi-book me-2"></i>
                        Add College Course
                    </h3>

                </div>


                <!-- Form -->
                <div class="card-body p-4">

                    <!-- Messages -->
                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show"
                                role="alert">

                                {% if message.tags == "success" %}

                                    <i class="bi bi-check-circle-fill me-2"></i>

                                {% elif message.tags == "error" %}

                                    <i class="bi bi-exclamation-triangle-fill me-2"></i>

                                {% endif %}

                                {{ message }}

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="alert">
                                </button>

                            </div>

                        {% endfor %}

                    {% endif %}


                    <form method="POST" onsubmit="return validate()">

                        {% csrf_token %}

                        <!-- Course Name -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                <i class="bi bi-book me-1"></i>
                                Select Course

                            </label>

                            <select name="course_name"
                                    id="course_name"
                                    class="form-select" required>

                                <option value="">
                                    Select Course
                                </option>

                                {% for course in courses %}

                                    <option value="{{ course.id }}"
                                        {% if request.POST.course_name == course.id|stringformat:"s" %}
                                            selected
                                        {% endif %}>

                                        {{ course.course_name }} - {{course.course_duration}} Duration

                                    </option>

                                {% endfor %}

                            </select>

                            <div id="course_name_error"
                                 class="text-danger small mt-1">
                            </div>

                        </div>


                        <!-- Course Status -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                <i class="bi bi-toggle-on me-1"></i>
                                Course Status

                            </label>

                            <select name="is_active"
                                    id="is_active"
                                    class="form-select">

                                <option value="True"
                                    {% if request.POST.is_active == "True" or not request.POST.is_active %}
                                        selected
                                    {% endif %}>

                                    Active

                                </option>

                                <option value="False"
                                    {% if request.POST.is_active == "False" %}
                                        selected
                                    {% endif %}>

                                    Inactive

                                </option>

                            </select>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">

                            <a href="#"
                               class="btn btn-outline-secondary">

                                <i class="bi bi-arrow-left me-1"></i>
                                Cancel

                            </a>


                            <button type="submit"
                                    class="btn btn-success">

                                <i class="bi bi-plus-circle me-1"></i>
                                Add Course

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="{% static 'college_js/college_add_course.js' %}"></script>

{% endblock %}
