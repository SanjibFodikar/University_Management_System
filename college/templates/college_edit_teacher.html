{% extends 'college_nav.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">
        <div class="card-header">
            <h4 class="mb-0">Edit Teacher</h4>
        </div>

        <div class="card-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <!-- Teacher Name -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Teacher Name</label>
                        <input type="text"
                               name="teacher_name"
                               class="form-control"
                               value="{{ teacher.teacher_name }}"
                               required>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ teacher.user.username }}"
                               required>
                    </div>

                    <!-- Qualification -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Qualification</label>
                        <input type="text"
                               name="teacher_qualification"
                               class="form-control"
                               value="{{ teacher.teacher_qualification }}"
                               required>
                    </div>

                    <!-- Phone -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text"
                               name="phone"
                               class="form-control"
                               value="{{ teacher.phone }}"
                               required>
                    </div>

                    <!-- Designation -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Designation</label>

                        <select name="designation" class="form-select" required>

                            <option value="">Select Designation</option>

                            <option value="Professor"
                                {% if teacher.designation == "Professor" %}selected{% endif %}>
                                Professor
                            </option>

                            <option value="Associate Professor"
                                {% if teacher.designation == "Associate Professor" %}selected{% endif %}>
                                Associate Professor
                            </option>

                            <option value="Assistant Professor"
                                {% if teacher.designation == "Assistant Professor" %}selected{% endif %}>
                                Assistant Professor
                            </option>

                            <option value="Lecturer"
                                {% if teacher.designation == "Lecturer" %}selected{% endif %}>
                                Lecturer
                            </option>

                            <option value="Guest Lecturer"
                                {% if teacher.designation == "Guest Lecturer" %}selected{% endif %}>
                                Guest Lecturer
                            </option>

                        </select>
                    </div>

                    <!-- Department -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Department</label>

                        <select name="department" class="form-select" required>

                            <option value="">Select Department</option>

                            {% for department in departments %}
                                <option value="{{ department.course_name.id }}"
                                    {% if teacher.department_id == department.id %}
                                        selected
                                    {% endif %}>
                                    {{ department.course_name.course_name }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>

                    <!-- Appointment Date -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Appointment Date</label>

                        <input type="date"
                               name="appointment_date"
                               class="form-control"
                               value="{{ teacher.appointment_date|date:'Y-m-d' }}"
                               required>
                    </div>

                </div>

                <div class="mt-3">

                    <button type="submit" class="btn btn-primary">
                        Update Teacher
                    </button>

                    <a href="{% url 'college_manage_teacher' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
