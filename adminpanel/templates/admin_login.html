{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container" style="margin-top: 100px;">
    <div class="text-center">
        <img src="{% static 'image/cartoon-admin.jpg' %}" class="rounded-circle shadow-sm" style="width: 100px;"
            alt="admin-face">
        <h4>Admin</h4>
    </div>

    <div class="row justify-content-center">

        <div class="col-lg-8 col-md-7 col-sm-10">

            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3><i class="bi bi-people me-1"></i>Admin Login</h3>
                </div>

                <div class="card-body">

                    {% if messages %}
                    {% for message in messages %}
                    {% if message.tags == 'error' %}
                    <div class="alert alert-danger alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% else %}
                    <div class="alert alert-success alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endif %}
                    {% endfor %}
                    {% endif %}

                    <form method="POST" onsubmit="return validate()">
                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label" for="Username">
                                <i class="bi bi-person-fill"></i>
                                Username
                            </label>

                            <input type="text" class="form-control" id="Username" name="username"
                                placeholder="Enter Username">

                            <div id="username_error"></div>

                        </div>


                        <div class="password mb-2">

                            <label for="password" class="form-label">
                                <i class="bi bi-lock-fill"></i>
                                Password
                            </label>

                            <div class="position-relative">

                                <input type="password" class="form-control pe-5" name="password" id="password"
                                    placeholder="Enter password" minlength="6">

                                <i class="bi bi-eye" id="eyeicon" style="position:absolute;
                      top:50%;
                      right:15px;
                      transform:translateY(-50%);
                      cursor:pointer;">
                                </i>

                            </div>

                            <div id="password_error"></div>

                        </div>


                        <div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Login
                            </button>
                        </div>

                    </form>
                </div>

            </div>

        </div>

    </div>
</div>


<script src="{% static 'admin_js/admin_login.js' %}"></script>

{% endblock %}
