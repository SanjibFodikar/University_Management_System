{% extends 'admin_nav.html' %}
{% load static %}

{% block content %}

<div class="container-fluid py-4">

    <!-- Page Heading -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">
                <i class="bi bi-person-badge me-2"></i>
                Visit Teacher
            </h3>
            <p class="text-muted mb-0">
                View and manage teacher information
            </p>
        </div>
    </div>


    <!-- Filter Card -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">

            <div class="row g-3">

                <!-- College -->
                <div class="col-md-4">
                    <label for="college" class="form-label fw-semibold">
                        College
                    </label>

                    <select id="college" class="form-select">
                        <option value="">Select College</option>

                        {% for college in colleges %}
                            <option value="{{ college.id }}">
                                {{ college.college_name }}
                            </option>
                        {% endfor %}

                    </select>
                </div>
            </div>

        </div>
    </div>

    <!-- Search Functionality -->
    <div class="search mb-4">
    <input 
        type="text"
        id="search"
        class="form-control"
        placeholder="Search Here"
        style="max-width: 800px; height: 50px;border: 1px solid black;"
        oninput="searchvalue(event)"
    >
</div>

    <!-- Teacher Table -->
    <div class="card border-0 shadow-sm">

        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-bold">
                <i class="bi bi-people me-2"></i>
                Teacher List
            </h5>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle mb-0">

                    <thead class="table-dark text-center">
                        <tr>
                            <th>#</th>
                            <th>Teacher Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Designation</th>
                            <th>Department</th>
                            <th>Qualification</th>
                            <th>Appointment Date</th>
                        </tr>
                    </thead>

                    <tbody id="teacherData" class="text-center">

                        

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

<script>
    document.getElementById('college').addEventListener('change',async (e)=>{
        let college_id=e.target.value;
        let response = await fetch(`/adminpanel/getTeacher/${college_id}/`)
        let data = await response.json()
        console.log(data)
        let teacherData=document.getElementById('teacherData')
        
        teacherData.innerHTML=""

        if (data.length === 0) {
            teacherData.innerHTML=`
                 <tr>
                      <td colspan="8"><i class="bi bi-exclamation-circle"></i> No Teachers Found</td>
                  </tr>`;
            return;
        }

        data.forEach((teacher,index) => {
        
            teacherData.innerHTML+=`
               <tr>
                    <td>${index+1}</td>

                    <td>${teacher.teacher_name}</td>

                    <td>${teacher.user__username}</td>

                    <td>${teacher.phone}</td>

                    <td>${teacher.designation}</td>

                    <td>${teacher.department__course_name__course_name}</td>

                    <td>${teacher.teacher_qualification}</td>

                    <td>${teacher.appointment_date}</td>
                </tr>
            `
        });
    })

    const searchvalue = (e)=>{
        console.log()
        let val = e.target.value.toLowerCase();
        console.log(val)
        let table=document.getElementById('teacherData')
        let tableRow=table.querySelectorAll('tr')
        tableRow.forEach((row)=>{
            let rowData=row.innerText.toLowerCase()
            if (rowData.includes(val)) {
                row.style.display=""
            }else{
                row.style.display="none"
            }
        })
    }
</script>

{% endblock %}
