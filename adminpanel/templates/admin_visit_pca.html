{% extends 'admin_nav.html' %}
{% load static %}
{% block content %}

<div class="container py-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">
            <i class="bi bi-person-workspace me-2"></i>
            PCA Marks
        </h4>
    </div>


    <!-- Filter Card -->
    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">
                <i class="bi bi-funnel me-2"></i>
                Select Details
            </h5>

        </div>


        <div class="card-body">

            <div class="row g-3">

                <!-- College Dropdown -->
                <div class="col-md-4">

                    <label for="college" class="form-label fw-semibold">
                        College
                    </label>

                    <select id="college" class="form-select">

                        <option value="">
                            Select College
                        </option>

                        {% for college in colleges %}

                        <option value="{{ college.id }}">
                            {{ college.college_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Course Dropdown -->
                <div class="col-md-4">

                    <label for="course" class="form-label fw-semibold">
                        Course
                    </label>

                    <select id="course" class="form-select">

                        <option value="">
                            Select Course
                        </option>

                    </select>

                </div>


                <!-- Semester Dropdown -->
                <div class="col-md-4">

                    <label for="semester" class="form-label fw-semibold">
                        Semester
                    </label>

                    <select id="semester" class="form-select">

                        <option value="">
                            Select Semester
                        </option>

                    </select>

                </div>

            </div>
        </div>

        <div id="pcaMarksContainer" class="mt-4">

        </div>

    </div>


    <!-- PCA Marks Result -->
    <div id="pcaMarksContainer" class="mt-4">

    </div>

    <div class="d-flex justify-content-center align-items-center gap-3 mt-4 mb-4">

    <button
        type="button"
        id="prevBtn"
        class="btn btn-secondary"
        >
        <i class="bi bi-chevron-left"></i>
        Previous
    </button>

    <span id="pageInfo" class="fw-bold">
        Page 0
    </span>

    <button
        type="button"
        id="nextBtn"
        class="btn btn-primary">
        Next
        <i class="bi bi-chevron-right"></i>
    </button>

</div>

</div>

<script src="{% static 'admin_js/admin_visit_pca_marks.js' %}"></script>

{% endblock content %}
